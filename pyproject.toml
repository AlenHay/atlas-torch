[project]
name = "atlas-torch"
version = "0.0.1"
description = "PyTorch backend for the BasicATLAS pipeline (ATLAS9 / DFSYNTHE / KAPPA9 / SYNTHE)"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.5", "numpy", "scipy", "h5py", "tqdm", "matplotlib"]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-timeout",
    "pyelftools>=0.33",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["stage: stage-tier tests (slow)", "full: full-tier tests (very slow)"]
